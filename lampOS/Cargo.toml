[workspace]
members = ["crates/acoustic", "crates/interaction", "crates/ipc", "crates/audio", "crates/ring", "crates/gemini", "crates/live", "crates/observer", "crates/motor", "crates/camera", "crates/environment", "crates/voice-eval"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hound = "3.5"
cpal = { git = "https://github.com/RustAudio/cpal.git", rev = "79275c2313da30e9f8b1ad8168385d091a2c9ada" }
rtrb = "0.4.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
