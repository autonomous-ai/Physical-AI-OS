# Lamp Pro: USB mic and speaker share the Seeed ReSpeaker Lite (XMOS XU316,
# USB 2886:0019, ALSA card "Lite"). Its USB firmware is fixed at S16_LE, 2 ch,
# 16 kHz in both directions. Verified on lamp-0c4e 2026-09-18: both capture
# channels carry the same processed (AEC/NS/AGC) signal, so ttable below just
# picks the left one. Playback goes through this same card, which is what feeds
# the on-chip AEC its reference. The profile disables the additional HAL software AEC.
#
# The card exposes no ALSA mixer controls, so speaker volume is a softvol stage
# ("Speaker", 0-100 = -40..0 dB) in front of dmix. HAL /audio/volume reaches it
# through ctl.device_speaker. The control only exists after the first PCM open;
# respeaker-lite-softvol.service (udev-triggered) does that at boot so the boot
# volume restore has something to write to.
pcm.respeaker_playback_shared {
    type dmix
    ipc_key 5838001
    ipc_perm 0666
    slave {
        pcm "hw:Lite,0"
        rate 16000
        channels 2
        period_size 320
        buffer_size 1280
    }
}
pcm.respeaker_capture_shared {
    type dsnoop
    ipc_key 5838002
    ipc_perm 0666
    slave {
        pcm "hw:Lite,0"
        rate 16000
        channels 2
        period_size 320
        buffer_size 1280
    }
}
pcm.respeaker_playback_vol {
    type softvol
    slave.pcm "respeaker_playback_shared"
    control { name "Speaker Playback Volume" card Lite }
    min_dB -40.0
    max_dB 0.0
    resolution 101
}
pcm.device_speaker { type plug slave.pcm "respeaker_playback_vol" }
ctl.device_speaker { type hw card Lite }

# Voice/STT mic: the ReSpeaker Lite processed output (left channel).
pcm.device_micro2 {
    type plug
    slave { pcm "respeaker_capture_shared" channels 2 }
    ttable.0.0 1
}
ctl.device_micro2 { type hw card Lite }

# Keep the onboard sensing microphone (ES8389) independent of voice capture.
pcm.device_micro1 {
    type plug
    slave.pcm { type hw card sndi2s4 device 0 }
    route_policy average
}
ctl.device_micro1 { type hw card sndi2s4 }

pcm.!default {
    type asym
    playback.pcm "device_speaker"
    capture.pcm "device_micro2"
}
ctl.!default { type hw card Lite }
