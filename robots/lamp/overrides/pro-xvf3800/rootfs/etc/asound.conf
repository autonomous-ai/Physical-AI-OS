# Lamp Pro (pro-xvf3800): USB mic and speaker share reSpeaker XVF3800 card Array.
# USB firmware must expose stereo 16 kHz and processed audio on channel 0.
pcm.respeaker_playback_shared {
    type dmix
    ipc_key 5838001
    ipc_perm 0666
    slave {
        pcm "hw:Array,0"
        rate 16000
        channels 2
        period_size 320
        buffer_size 1280
    }
}
pcm.respeaker_capture_shared {
    type dsnoop
    ipc_key 5838002
    ipc_perm 0666
    slave {
        pcm "hw:Array,0"
        rate 16000
        channels 2
        period_size 320
        buffer_size 1280
    }
}
pcm.device_speaker { type plug slave.pcm "respeaker_playback_shared" }
ctl.device_speaker { type hw card Array }

# Select the processed left channel instead of averaging with the ASR/raw right.
pcm.device_micro2 {
    type plug
    slave { pcm "respeaker_capture_shared" channels 2 }
    ttable.0.0 1
}
ctl.device_micro2 { type hw card Array }

# Keep the onboard sensing microphone independent of voice capture.
pcm.device_micro1 {
    type plug
    slave.pcm { type hw card sndi2s4 device 0 }
    route_policy average
}
ctl.device_micro1 { type hw card sndi2s4 }

pcm.!default {
    type asym
    playback.pcm "device_speaker"
    capture.pcm "device_micro2"
}
ctl.!default { type hw card Array }
