# Persistent ALSA aliases for the lamp (Orange Pi 4 Pro, A733 / T527).
# Card ids name HARDWARE (set by udev, one id per card); pcm/ctl aliases name
# ROLES that /opt/hal/.env refers to. One card can back several roles.
#
# Speaker:  playback side of the C-Media USB Audio Adapter (card device_cmedia,
#           0d8c:0014). Replaced the TTGK USB speaker on 2026-09-18 (lamp-4ace fit).
# Micro1:   capture side of the same C-Media card (device_cmedia) for
#           sensing/wake. Replaced the ES8389 onboard codec (sndi2s4) on 2026-09-17.
# Micro2:   Jieli USB Composite Device (device_micro2, renamed via udev) for STT.
# Micro3:   SunplusIT OPENAICAM built-in mic (device_micro3, renamed via udev).
#
# Card ids are role-based and kept <=15 chars (kernel snd_card.id limit). The
# card id matches its pcm alias name (separate ALSA namespaces, so this is valid).

# Speaker volume is a softvol stage, not the C-Media hardware mixer. Measured
# on lamp-4ace 2026-09-21: the PAM8610 amp is so hot that mixer step 1 of 37
# (-36 dB) is already "loud enough", so the whole usable range sat in the
# bottom 5 steps and a slider from 1% to the 15% ceiling changed nothing
# audible. The hardware "Speaker" control is pinned to step 6 (-31 dB) by
# lamp-cmedia-speaker.service at boot; the softvol below spreads -30..0 dB
# relative to that pin over 0-100, so 100% = the old ceiling, 1% is near
# silence, and every step in between is a different loudness.
#
# The softvol control lives on the HDMI card: that card has no playback-volume
# control of its own, so HAL's mixer scan (pvolume without cvolume) finds only
# this one. On device_cmedia it would sit next to the hardware "Speaker" and
# HAL would write both, undoing the pin. Like the ReSpeaker Lite build, the
# control only exists after the first PCM open — the same service does that.
# The raw PCM is NOT named device_speaker_*: HAL matches the env alias as a
# substring of PortAudio device names, and device_speaker_hw sorted first,
# so HAL played straight into the hardware and skipped the softvol.
pcm.cmedia_playback_raw {
    type plug
    slave.pcm {
        type hw
        card device_cmedia
        device 0
    }
}
pcm.device_speaker {
    type softvol
    slave.pcm "cmedia_playback_raw"
    control { name "Speaker Playback Volume" card allwinnerhdmi }
    min_dB -30.0
    max_dB 0.0
    resolution 101
}
ctl.device_speaker { type hw card allwinnerhdmi }

pcm.device_micro1 {
    type plug
    slave.pcm {
        type hw
        card device_cmedia
        device 0
    }
    route_policy average
}
ctl.device_micro1 { type hw card device_cmedia }

pcm.device_micro2 {
    type plug
    slave.pcm {
        type hw
        card device_micro2
        device 0
    }
}
ctl.device_micro2 { type hw card device_micro2 }

pcm.device_micro3 {
    type plug
    slave.pcm {
        type hw
        card device_micro3
        device 0
    }
}
ctl.device_micro3 { type hw card device_micro3 }

pcm.!default {
    type asym
    playback.pcm "device_speaker"
    capture.pcm "device_micro2"
}
ctl.!default { type hw card sndi2s4 }
